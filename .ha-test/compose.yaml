services:
  homeassistant:
    container_name: vilnius-live-cameras-ha-test
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    restart: "no"
    ports:
      - "8124:8123"
    volumes:
      - ./config:/config
      - ../custom_components/vilnius_live_cameras:/config/custom_components/vilnius_live_cameras:ro
    environment:
      TZ: Europe/Vilnius
